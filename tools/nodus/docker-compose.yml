services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nodus
      POSTGRES_PASSWORD: nodus
      POSTGRES_DB: nodus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nodus:nodus@postgres:5432/nodus
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      # Sandboxed code execution: the backend asks the host daemon for a
      # disposable container. Remove this line to disable execution entirely.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
