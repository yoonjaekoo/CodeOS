<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>허용 목록 제한</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f5f7fa;
            color: #17181a;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                "Noto Sans KR",
                sans-serif;
        }

        .container {
            width: min(560px, calc(100% - 40px));
            text-align: center;
        }

        .icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;

            font-size: 28px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin: 0;

            font-size: clamp(32px, 6vw, 48px);
            font-weight: 750;
            letter-spacing: -0.04em;
        }

        .message {
            margin: 16px 0 0;

            color: #6b7280;
            font-size: 17px;
            line-height: 1.7;
            letter-spacing: -0.02em;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 32px;
            padding: 9px 14px;

            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 999px;

            color: #4b5563;
            font-size: 13px;
            font-weight: 600;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
        }

        .time {
            margin-top: 42px;

            color: #9ca3af;
            font-size: 13px;
        }

        @media (prefers-reduced-motion: no-preference) {
            .container {
                animation: appear 0.45s ease-out;
            }

            @keyframes appear {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>허용 목록에 없는 사이트입니다.</h1>

        <p class="message">
            이 사이트는 허용 목록에 등록되어 있지 않습니다.<br>
            사용하려면 CodeOS 허용 목록에 도메인을 추가해 주세요.
        </p>

        <div class="status">
            <span class="dot"></span>
            허용 목록 정책 적용 중
        </div>

        <div class="time" id="time"></div>

    </main>

    <script>
        function updateTime() {
            const now = new Date();

            const time = now.toLocaleTimeString("ko-KR", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });

            document.getElementById("time").textContent = time;
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
